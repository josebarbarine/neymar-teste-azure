name: Build and deploy container to Azure Web App

on:
  push:
    branches:
      - main # ou master, dependendo do nome da sua branch principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Actions
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: conteiney-facwhxb2fmfre6hc.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container image to ACR
        run: |
          docker build -t conteiney-facwhxb2fmfre6hc.azurecr.io/minha-app:${{ github.sha }} .
          docker push conteiney-facwhxb2fmfre6hc.azurecr.io/minha-app:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'appneymar'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'conteiney-facwhxb2fmfre6hc.azurecr.io/minha-app:${{ github.sha }}'
