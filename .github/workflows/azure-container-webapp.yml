name: Build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: 'appneymar'       # O nome do seu Web App
  ACR_NAME: 'conteiney'                # O nome do seu Container Registry
  IMAGE_NAME: 'conteiney.azurecr.io/minha-app' # O caminho completo da sua imagem Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Autentica no Azure usando a credencial salva no GitHub Secrets
      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Autentica especificamente no seu Azure Container Registry (conteiney)
      - name: Login no ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # 4. Faz o build da imagem Docker (usando a tag 'latest' e o hash do commit)
      - name: Build Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      # 5. Envia a imagem para o seu ACR
      - name: Push Docker
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build # Garante que o deploy só rode se o build der certo
    environment:
      name: 'Development'

    steps:
      # 1. Autentica novamente no Azure para o deploy
      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Faz o deploy da imagem que acabou de ser "upada" no Web App 'appneymar'
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.IMAGE_NAME }}:latest'
