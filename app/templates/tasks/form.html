{% extends "base.html" %}
{% block title %}{{ 'Editar' if task else 'Nova' }} Tarefa{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card">
      <div class="card-header py-3">
        <h5 class="mb-0 fw-bold">
          <i class="fas fa-{% if task %}pen{% else %}plus-circle{% endif %} me-2 text-primary"></i>
          {{ 'Editar Tarefa' if task else 'Nova Tarefa' }}
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control"
                   value="{{ task.title if task else '' }}"
                   placeholder="Descreva a tarefa..." required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Descrição</label>
            <textarea name="description" class="form-control" rows="4"
                      placeholder="Detalhes opcionais...">{{ task.description if task else '' }}</textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label fw-semibold">Prioridade</label>
              <select name="priority" class="form-select">
                <option value="low"    {{ 'selected' if task and task.priority=='low' }}>↓ Baixa</option>
                <option value="medium" {{ 'selected' if not task or task.priority=='medium' }}>→ Média</option>
                <option value="high"   {{ 'selected' if task and task.priority=='high' }}>↑ Alta</option>
              </select>
            </div>
            {% if task %}
            <div class="col-6">
              <label class="form-label fw-semibold">Status</label>
              <select name="status" class="form-select">
                <option value="pending"     {{ 'selected' if task.status=='pending' }}>Pendente</option>
                <option value="in_progress" {{ 'selected' if task.status=='in_progress' }}>Em Progresso</option>
                <option value="completed"   {{ 'selected' if task.status=='completed' }}>Concluída</option>
              </select>
            </div>
            {% endif %}
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="fas fa-save me-1"></i>Salvar
            </button>
            <a href="{{ url_for('tasks.index') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
